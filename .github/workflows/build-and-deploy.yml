# =============================================================================
# 自动编译所有 slides/*/main.typ → PDF，部署到 GitHub Pages，并自动发版本
# （把 PDF 作为附件上传到 GitHub Release）。
#
# 目录约定：
#   slides/<名称>/main.typ  →  https://<用户名>.github.io/<仓库名>/<名称>.pdf
#   首页（自动生成的导航页）→  https://<用户名>.github.io/<仓库名>/
#
# 三个 job 各司其职，权限互不重叠：
#   build   → 装字体 + 编译 PDF（增量）+ 生成导航页 + 上传产物   （contents: read）
#   deploy  → 把 build/ 目录发布到 GitHub Pages                 （pages/id-token: write）
#   release → 按日期发版并创建 Release，附上全部 PDF             （contents: write）
#
# 你不需要手动打 tag：每次推送到 main 且构建成功后，release job 会用
# 当天日期（默认 Asia/Shanghai，见 RELEASE_TZ）创建/更新 Release，例如 v2026.09.30。
# 同一天多次 push 只刷新这一个 Release 的 PDF，不会新增 tag；跨天自动新建。
# 想额外留一个正式快照时，手动打 tag 推送即可（例如 v2.0.0）。
# =============================================================================

name: Build & Deploy Slides

on:
  push:
    branches: [main] # 推送到 main：编译 + 部署 Pages + 自动发版本
    tags: ["v*"] # 手动推送 tag：编译 + 用这个 tag 发版本（不重新部署 Pages）
  release:
    types: [published] # 在网页上「发布 Release」时也把 PDF 补传上去
  workflow_dispatch: # 支持在 Actions 页面手动运行（只构建/部署，不发版本）

env:
  # Typst 版本。锁版本可保证构建可复现。
  # 注意**别写成 latest**：stamp 里存的是这个字符串、靠它做「编译环境变了就全量」的判断，
  # latest == latest 永远成立，上游升级就不会触发全量，未改动的 deck 会一直复用旧版编出的 PDF。
  # 想升级就改成具体版本号（改完这一处，哈希与版本都变，会自动全量重编一次）。
  TYPST_VERSION: "0.15.1"
  # 编译产物目录（Pages 站点根目录）
  BUILD_DIR: build
  # 按日期发版时用哪个时区决定 tag 里的日期（想用 UTC 就写 UTC）
  RELEASE_TZ: "Asia/Shanghai"

# 默认最小权限；需要更高权限的 job 会在下面单独声明
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 0) 门禁：本地校验脚本（verify-site.sh）当 CI 门禁跑。
  #
  # 为什么值得单开一个 job 而不是塞进 build：这段 CI 逻辑里有几个**静默失效**的不变量
  # ——stamp 基准、文件夹名护栏、编译失败必须 exit 1、删了 deck 要清残留。它们破了不会
  # 报错，只会安静地发布残缺内容或复用旧 PDF。verify-site.sh --build 真跑六条路径来守它们。
  #
  # 为什么不塞进 build 的步骤里：build 最后会写 .build-stamp。若「编译 → 写 stamp →
  # 门禁失败」这个顺序成立，stamp 已经落盘，下次 push 会以为编译过了而跳过重编 ——
  # 门禁反而制造了它本该防的那种不一致。独立 job 从结构上避免。
  #
  # 为什么放在最前面：它要真编译含中文的 deck，所以也得装同一套字体（否则环境差异会假红），
  # 但比 build 少了恢复缓存、生成导航页、上传产物这些步骤，失败得更快；
  # build 用 needs 依赖它，红了就整体不部署。
  # ---------------------------------------------------------------------------
  verify:
    name: 校验 CI 逻辑（门禁）
    runs-on: ubuntu-latest
    if: github.event.deleted != true
    # 这个 job 会自己编译 5 次（六条路径里的五条），给个上限免得异常时一直挂着
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 门禁脚本不需要推送、也不用 git 凭据，别把 token 留在 .git/config 里
          persist-credentials: false

      - name: 安装模板字体（Noto Sans CJK SC / Inter）
        run: |
          # 和 build job 装同一套：脚本要真的编译 deck（含中文），字体齐全才能保证
          # 它不会因为环境差异而假红。故意不装 fonts-noto-cjk-extra（理由见 build job）。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-inter \
            || sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: 安装 Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: 跑 verify-site.sh --build
        run: bash verify-site.sh --build

  # ---------------------------------------------------------------------------
  # 1) 安装字体、编译幻灯片（增量）、准备好 Pages 站点内容
  # ---------------------------------------------------------------------------
  build:
    name: 编译幻灯片
    needs: verify
    runs-on: ubuntu-latest
    # 删除 tag / 分支同样会产生 push 事件（deleted: true）。必须忽略，
    # 否则删掉 v2026.09.30 之后工作流会认为「该版本不存在」而把它重新创建出来。
    if: github.event.deleted != true
    # 上限：装字体 + 全量编译（最坏情况：缓存没了 + deck 变多）。不设上限时卡住的 job 会占满默认 6 小时
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 普通 push / 手动运行：检出触发它的那个 ref；
          # release 事件下不同来源对 github.ref 的描述不一致，这里显式优先用
          # 被发布 Release 的 tag，保证「Release 里的 PDF」就是该 tag 的代码。
          ref: ${{ github.event.release.tag_name || github.ref }}
          # 增量编译要对比「上一次提交」，所以需要完整历史（仓库很小，代价可忽略）
          fetch-depth: 0
          # 编译步骤只用本地 git 命令（hash-object / diff / cat-file），不需要凭据
          persist-credentials: false

      # 模板里指定的字体（见 slides/*/main.typ 的 #set text）：
      #   Noto Sans CJK SC → 中文；Inter → 西文；New Computer Modern Math 由 Typst 自带。
      # 不装字体也能编译成功，但中文会缺字/回退，所以这里默认装好。
      - name: 安装模板字体（Noto Sans CJK SC / Inter）
        run: |
          sudo apt-get update
          # 说明：这里故意不装 fonts-noto-cjk-extra —— 它要额外下载约 145MB，
          # 而模板只用到 Regular / Bold。若确实需要 Light / Medium 等更多中文字重，
          # 把 fonts-noto-cjk-extra 加回下面的列表即可。
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-inter \
            || sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

          # 打印实际识别到的字族，方便排查字体问题（找不到时不要让步骤失败）
          fc-list : family | grep -iE 'noto sans cjk|inter' | sort -u | head -n 10 || true

      - name: 安装 Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}
          # 可选优化：把 cache-dependency-path 指向一个「只含 @preview import 行」的
          # .typ 文件即可缓存宏包（该输入只接受单个可编译的文件，不支持通配符）。
          # 需要时见 AGENTS.md 第 8 节「可能的后续改进」。

      # 增量编译的核心：把上一次的 build/ 目录取回来。
      # 没改动的幻灯片直接复用里面的 PDF，只重新编译改动过的那些。
      # 只有 main 分支的 push 才走增量；tag / release / 手动运行都全量编译。
      - name: 恢复上次的编译产物（增量编译用）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}
          key: slides-build-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            slides-build-${{ github.ref_name }}-

      - name: 编译 slides/*/main.typ → build/*.pdf
        run: |
          set -uo pipefail

          build_dir="$PWD/$BUILD_DIR"
          mkdir -p "$build_dir"

          # ---------- 1) 判断这次是增量还是全量 ----------
          # 复用基准是「上一次真正编译成功时的提交」，记在缓存目录里的 .build-stamp，
          # 而**不是** github.event.before。这个区别很关键：before..GITHUB_SHA 只覆盖本次 push，
          # 一旦上一次运行失败（缓存没存下来）或两次 push 挨得很近，那一次改过的 deck 就既不在
          # diff 里、缓存里又是旧 PDF，会被一直复用成旧版本 —— 线上 PDF 与 main 不一致且不会自愈。
          # stamp 里还带 Typst 版本与 workflow 内容的哈希：编译环境变了就整体重编。
          wf_rev="$(git hash-object .github/workflows/build-and-deploy.yml 2>/dev/null | cut -c1-12)"
          stamp="$build_dir/.build-stamp"
          stamp_sha=""; stamp_ver=""; stamp_wf=""
          base_sha=""
          if [ -f "$stamp" ]; then
            read -r stamp_sha stamp_ver stamp_wf < "$stamp" || true
            if [ "$stamp_ver" = "$TYPST_VERSION" ] && [ "$stamp_wf" = "$wf_rev" ]; then
              base_sha="$stamp_sha"
            else
              echo "编译环境变了（Typst ${stamp_ver:-?} → ${TYPST_VERSION}，workflow ${stamp_wf:-?} → ${wf_rev}），改为全量编译"
            fi
          fi

          full_rebuild=1
          changed=""
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] \
             && [ "${GITHUB_REF:-}" = "refs/heads/main" ] \
             && [ -n "$base_sha" ] \
             && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            full_rebuild=0
            # core.quotePath=false 是**必须**的：文件夹名允许汉字/假名/emoji（§3.8），
            # 而 git 默认把非 ASCII 路径转义成带引号的 "\346\226\207..." 八进制形式，
            # 下面 grep -F "slides/中文/" 就永远匹配不上 → 该 deck 被当成「没有改动」而
            # 复用旧 PDF，stamp 却照写新提交 → 静默发布旧内容且永不自愈（已实测复现）。
            if ! changed="$(git -c core.quotePath=false diff --name-only "$base_sha" "$GITHUB_SHA" -- slides)"; then
              # diff 失败（例如基准对象不在本地）**不能**当成「没有改动」——那同样会
              # 复用整套旧 PDF，所以退回全量编译（fail safe）。
              echo "::warning::git diff 失败，无法确定改动范围，改为全量编译"
              full_rebuild=1
              changed=""
            else
              echo "增量编译：基准 ${base_sha:0:7} → ${GITHUB_SHA:0:7}，涉及以下文件"
              if [ -n "$changed" ]; then printf '%s\n' "$changed" | sed 's/^/  /'; else echo "  （slides/ 下没有改动）"; fi
            fi
          else
            echo "全量编译：非 main push，或缓存里没有上次成功的编译记录（首次 / 缓存被清理 / 上次编译失败）"
          fi

          # ---------- 2) 逐套幻灯片编译 ----------
          names_file="$(mktemp)"
          found=0
          failed=0
          rebuilt=0
          reused=0

          for dir in slides/*/; do
            # 只处理包含 main.typ 的子目录，其他目录自动忽略
            [ -f "${dir}main.typ" ] || continue
            found=1
            name="$(basename "$dir")"

            # 文件夹名会直接变成 URL 路径（<名称>.pdf）和首页链接，所以限制字符集：
            # 允许汉字 / 字母 / 数字 / 点 / 下划线 / 连字符，其它 ASCII 字符（空格、引号、
            # & # ? 等）会让链接或 Markdown 说明出问题，直接报错让人改名。
            # 做法：删掉允许的 ASCII 与所有高位字节（UTF-8 汉字由高位字节组成），还剩东西就是非法字符。
            unsafe="$(printf '%s' "$name" | LC_ALL=C tr -d 'A-Za-z0-9._-' | LC_ALL=C tr -d '\200-\377')"
            if [ -n "$unsafe" ]; then
              # 用 %q 把空格、引号之类的字符显示出来（否则报错里看不出是哪个字符）
              echo "::error::文件夹名 ${name} 含不安全的字符（$(printf '%q' "$unsafe")），请只用汉字/字母/数字/点/下划线/连字符"
              failed=1
              continue
            fi

            printf '%s\n' "$name" >> "$names_file"

            # 需要重新编译：全量编译、缓存里没有这份 PDF、或该目录这次有改动
            need=1
            if [ "$full_rebuild" -eq 0 ] && [ -f "$build_dir/$name.pdf" ]; then
              if ! printf '%s\n' "$changed" | grep -qF -- "$dir"; then
                need=0
              fi
            fi

            if [ "$need" -eq 1 ]; then
              echo "::group::编译 $name"
              # 关键：先进入幻灯片所在目录再编译，
              # 这样 main.typ 里的相对路径（如 image("src/xxx.png")）才能正确解析。
              if (cd "$dir" && typst compile main.typ "$build_dir/$name.pdf"); then
                echo "✅ $name → $BUILD_DIR/$name.pdf"
                rebuilt=$((rebuilt + 1))
              else
                echo "::error::幻灯片 $name 编译失败，请检查 ${dir}main.typ"
                failed=1
              fi
              echo "::endgroup::"
            else
              echo "⏭️  $name 没有改动，复用 $BUILD_DIR/$name.pdf"
              reused=$((reused + 1))
            fi
          done

          # ---------- 3) 清理被删除 / 改名后残留的旧 PDF ----------
          for pdf in "$build_dir"/*.pdf; do
            [ -e "$pdf" ] || continue
            n="$(basename "$pdf" .pdf)"
            if ! grep -qxF -- "$n" "$names_file"; then
              echo "🧹 删除已不存在的幻灯片产物：$n.pdf"
              rm -f "$pdf"
            fi
          done
          rm -f "$names_file"

          # ---------- 4) 结果校验 ----------
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何 slides/*/main.typ，请先添加幻灯片。"
            exit 1
          fi
          # 有任何一份编译失败就终止，避免把不完整的站点发布出去
          if [ "$failed" -ne 0 ]; then
            echo "::error::存在编译失败的幻灯片，已停止后续部署。"
            exit 1
          fi

          # 记下这次成功编译的状态，给下一次增量复用当基准（只有全部成功才会走到这里）。
          # 它是 build/ 里的隐藏文件：patch 的缓存会带上它，而 artifact 与 Pages 都不会发布它。
          printf '%s %s %s\n' "$GITHUB_SHA" "$TYPST_VERSION" "$wf_rev" > "$build_dir/.build-stamp"

          echo "编译完成：新编译 $rebuilt 套，复用 $reused 套"
          ls -lh "$build_dir"

      - name: 生成导航页 build/index.html
        run: |
          set -euo pipefail

          template="index.template.html"
          [ -f "$template" ] || { echo "::error::缺少首页模板 ${template}"; exit 1; }

          # ---------- 0) 站点静态资源 ----------
          # 头像等资源放在仓库的 assets/ 里，构建时拷进站点根目录（Pages 只发布 build/）。
          # 故意做成 fail closed：文件不在时页面不会报错，只是那张图被 onerror 静默删掉，
          # 属于最难发现的坏法 —— 宁可整次构建失败。
          #
          # 先清掉 build/ 里「非 PDF、非 index.html」的旧文件：build/ 是 actions/cache 的缓存
          # 对象，只清 *.pdf 的话，某个版本拷进来、后来不再拷的静态资源会**永久**被缓存带下去，
          # 并随两份 artifact 一起发布到站点根目录（自愈不了）。点号开头的 .build-stamp 不匹配
          # "$BUILD_DIR"/*，会被保留 —— 它是下次增量编译的基准。
          for stale in "$BUILD_DIR"/*; do
            [ -e "$stale" ] || continue
            case "$(basename "$stale")" in
              *.pdf | index.html) ;;
              *) echo "🧹 删除 build/ 里已不再生成的旧文件：$(basename "$stale")"; rm -rf "$stale" ;;
            esac
          done

          [ -f assets/icon.png ] || { echo "::error::缺少站点资源 assets/icon.png"; exit 1; }
          cp assets/icon.png "$BUILD_DIR/icon.png"

          # ---------- 1) 为每套幻灯片生成一张卡片 ----------
          items="$RUNNER_TEMP/slides-items.html"
          : > "$items"
          count=0

          # 取 main.typ 里 config-info 的 title / subtitle。
          # title 取不到时退回文件夹名；subtitle 取不到（含 subtitle: [] 和 A4 文档）时
          # 卡片**不渲染**那行描述，而不是塞一句默认文案 —— 少一行说明总好过一句假话。
          # 依次尝试：[..] 单独成行 → 单行里的 [..] → ".." 字符串写法。两处细节：
          #   1) 跳过注释行，否则 // title: [旧标题] 会被当成真标题；
          #   2) 单行写法要求键前面不是字母/下划线，否则 subtitle: 里的 title: 会被贪婪匹配成标题。
          pick() {
            local value
            value="$(sed -nE "/^[[:space:]]*\/\//d; s/^[[:space:]]*$2:[[:space:]]*\[([^]]*)\].*/\1/p" "$1" | head -n 1)"
            if [ -z "$value" ]; then
              value="$(sed -nE "/^[[:space:]]*\/\//d; s/.*[^[:alnum:]_]$2:[[:space:]]*\[([^]]*)\].*/\1/p" "$1" | head -n 1)"
            fi
            if [ -z "$value" ]; then
              value="$(sed -nE "/^[[:space:]]*\/\//d; s/.*[^[:alnum:]_]$2:[[:space:]]*\"([^\"]*)\".*/\1/p" "$1" | head -n 1)"
            fi
            printf '%s' "$value"
          }
          escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          for dir in slides/*/; do
            [ -f "${dir}main.typ" ] || continue
            name="$(basename "$dir")"
            pdf="$BUILD_DIR/$name.pdf"
            [ -e "$pdf" ] || continue
            count=$((count + 1))

            title="$(pick "${dir}main.typ" title)"
            [ -n "$title" ] || title="$name"

            subtitle="$(pick "${dir}main.typ" subtitle)"

            bytes="$(wc -c < "$pdf" | tr -d ' ')"
            # 1 KB 以下显示 B；不到 1 MiB 的用 KB（封顶 1023，免得 1048575 被四舍五入成 "1024 KB"）
            size="$(awk -v b="$bytes" 'BEGIN { if (b < 1024) { printf "%d B", b } else if (b < 1048576) { kb = b / 1024; if (kb > 1023) kb = 1023; printf "%.0f KB", kb } else { printf "%.1f MB", b / 1048576 } }')"

            # 页数：Typst 产出的 PDF 是未压缩的，页树根节点的 /Count 就是总页数
            # （已核对 26-09-30=49、template=20，与逐页渲染数一致）。
            # 取 /Count 的最大值而不是第一个，避免个别 struct tree 的计数排在前面；
            # 再限定 1–4 位数字，免得二进制里凑巧出现的字节被当成计数。
            # 万一以后 PDF 被压缩、这里读不到，会渲染成空胶囊（不至于显示错的页数）。
            # 注意末尾的 `|| true`：grep 无匹配时退出 1，在本步的 set -euo pipefail 下
            # 会**直接终止整个步骤**（那就不是「空胶囊」而是整次部署被跳过），所以必须吞掉。
            pages="$(strings "$pdf" | grep -o '/Count [0-9]\{1,4\}' | awk '{print $2}' | sort -n | tail -1)" || true
            pages_html="<span class=\"badge\">${pages} 页</span>"

            title_html="$(printf '%s' "$title" | escape)"
            name_html="$(printf '%s' "$name" | escape)"
            size_html="<span class=\"badge\">${size}</span>"

            # 副标题为空（没写 / subtitle: [] / A4 文档）时整行都不输出。
            # 用变量而不是「if 里再写一遍 cat <<HTML」，是为了让卡片结构在整个脚本里只有一份。
            # 变量里只放标签本身，不带缩进也不带换行 —— 缩进和换行由模板那一行提供；
            # 变量里若自带换行，空串时会把下一行顶下去，在卡片中间留下一行纯空格。
            # 也注意别把变量写在行首：YAML 的块标量会因此提前结束。
            desc_html=""
            if [ -n "$subtitle" ]; then
              desc_html="<div class=\"deck-desc\">$(printf '%s' "$subtitle" | escape)</div>"
            fi

            # 卡片结构对应 index.template.html 里的 .deck 样式
            cat <<HTML >> "$items"
                  <div class="deck fade" style="--i: $count">
                    <span class="bar"></span>
                    <div class="deck-main">
                      <a class="deck-title" href="${name_html}.pdf" target="_blank" rel="noopener noreferrer">
                        ${title_html}
                        <svg class="ext" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
                      </a>
                      ${desc_html}
                      <div class="deck-meta">
                        ${pages_html}${size_html}<span class="file">${name_html}.pdf</span>
                      </div>
                    </div>
                    <span class="beam"></span>
                  </div>
          HTML
          done

          # ---------- 2) 把生成结果套进模板 ----------
          # 只写「最后更新」：这是**构建**时间，不是每套幻灯片的内容时间（改一套 deck 也会
          # 让首页时间戳刷新），所以不配提交号，免得被读成「最新内容就是这个提交」。
          meta="最后更新 $(TZ="${RELEASE_TZ}" date '+%Y-%m-%d %H:%M')"

          awk -v items="$items" -v count="$count" -v meta="$meta" '
            /<!--SLIDES-->/ { while ((getline line < items) > 0) print line; close(items); next }
            /<!--COUNT-->/  { sub(/<!--COUNT-->/, count); print; next }
            /<!--META-->/   { sub(/<!--META-->/, meta); print; next }
            { print }
          ' "$template" > "$BUILD_DIR/index.html"

          echo "已生成 $BUILD_DIR/index.html（$count 套幻灯片，$(wc -c < "$BUILD_DIR/index.html" | tr -d ' ') bytes）"

      # 给 release job 下载用的普通产物（下载后仍是 build/xxx.pdf，便于直接用通配符上传）
      # 只在同一次运行内被用到，保留 3 天：既不会堆积，隔天重跑失败的 job 也还拿得到
      - name: 上传 PDF 产物
        uses: actions/upload-artifact@v7
        with:
          name: slides-build
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 3

      # 给 deploy job 用的 Pages 站点产物（整份 build/ 目录，含 index.html）
      - name: 上传 Pages 站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_DIR }}

  # ---------------------------------------------------------------------------
  # 2) 部署到 GitHub Pages
  #    只在 main 分支的 push / 手动运行（且手动运行时也选的 main）才部署；
  #    tag 推送和 release 事件只发版本，不动线上站点。
  # ---------------------------------------------------------------------------
  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 上限：部署本身很快，卡住通常是 Pages 侧问题，别让它占满默认 6 小时
    timeout-minutes: 10
    # 同一时间只允许一个 Pages 部署，避免并发部署互相覆盖；不打断已在进行的部署
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # 创建 Pages 部署
      id-token: write # 申请 OIDC token，验证部署来源
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  # 3) 按日期发版：算出当天的 tag → 创建/更新 Release → 把 PDF 全部传上去
  # ---------------------------------------------------------------------------
  release:
    name: 自动发版本并上传 PDF
    needs: build
    if: >-
      github.event.deleted != true
      && (github.event_name == 'release'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    # 上限：只是 gh + 上传附件，超时说明 GitHub API 侧卡住了
    timeout-minutes: 10
    # 发布 Release 时 GitHub 会同时产生 tag push 事件，可能让本工作流跑两次并操作
    # 同一个 Release；用同一个 concurrency group 把两次运行串行化，避免并发冲突。
    concurrency:
      group: release-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # 创建 tag / Release 并上传附件
    steps:
      # tag 规则：
      #   * main 推送        → 按日期命名，例如 v2026.09.30；
      #                        同一天再 push 只更新这个 Release 的附件，不会新增 tag
      #   * 手动推送 v* tag   → 用该 tag 建一个额外的版本化 Release（与你手动的 tag 同名）
      #   * release 事件      → 只给那个 Release 补附件，不动说明
      - name: 计算 tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag=""
          managed=false

          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ -n "${RELEASE_TAG}" ]; then
            tag="${RELEASE_TAG}"
            echo "使用 Release 自带的 tag：${tag}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "使用本次推送的 tag：${tag}"
          else
            # 日常 push：按日期命名，同一天只维护一个 Release
            tag="v$(TZ="${RELEASE_TZ}" date +%Y.%m.%d)"
            managed=true
            echo "按日期发版：${tag}（同一天的多次 push 只更新这一个 Release）"
          fi

          # 该 Release 是否已存在：
          #   false → 本次新建，可以写一份自动说明
          #   true  → 已存在；当天再次 push 时刷新说明，其它版本化 Release 只补附件
          # 「不存在」和「查不到」必须分开判断：把 403 限流 / 5xx / 网络错误当成「不存在」，
          # 会让一个已存在的版本化 Release 走「新建」分支并带上自动说明 —— 覆盖掉用户手写的说明。
          # 所以只有明确报 not found / 404 才判 false，其它错误一律 fail closed。
          if view_out="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" 2>&1)"; then
            exists=true
          elif printf '%s' "$view_out" | grep -qiE 'not found|HTTP 404'; then
            exists=false
          else
            echo "::error::无法确认 Release ${tag} 是否存在（gh 报错：${view_out}）。宁可失败也不覆盖可能存在的说明。"
            exit 1
          fi
          echo "Release ${tag} 是否已存在：${exists}"

          {
            echo "tag=${tag}"
            echo "managed=${managed}"
            echo "exists=${exists}"
          } >> "$GITHUB_OUTPUT"

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: slides-build
          path: ${{ env.BUILD_DIR }}

      # 生成说明：按日期维护的那个 Release 每次都刷新；
      # 其它版本化 Release 只在新建时写一次，已存在时绝不动你手写的说明。
      - name: 生成 Release 说明
        if: steps.version.outputs.managed == 'true' || steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MANAGED: ${{ steps.version.outputs.managed }}
        run: |
          set -euo pipefail
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          # tag 里可能出现 git ref 允许的任何字符（( ) 空格 # % & 等），放进 URL 路径必须整体
          # 转义，否则 Markdown 链接会被截断或指向别处。用 python3 按 RFC 3986 做百分号编码
          # （ubuntu-latest 自带 python3，verify-site.sh 也依赖它）。
          tag_url="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TAG")"

          {
            if [ "${MANAGED}" = "true" ]; then
              echo "📅 **本 Release 按日期维护（${TAG}）**：同一天的多次 push 会刷新下面的 PDF；跨天后会自动新建一个日期版本。"
              echo
            fi
            echo "包含以下幻灯片（左侧链接在线预览，右侧链接直接下载）："
            echo
            for pdf in "$BUILD_DIR"/*.pdf; do
              [ -e "$pdf" ] || continue
              name="$(basename "$pdf")"
              echo "- [\`${name}\`](${site}/${name}) · [下载](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag_url}/${name})"
            done
            echo
            echo "站点首页：<${site}/>"
            echo
            echo "<sub>由 GitHub Actions 自动生成 · 提交 \`${GITHUB_SHA:0:7}\`</sub>"
          } > "$RUNNER_TEMP/release-notes.md"

          cat "$RUNNER_TEMP/release-notes.md"

      # 当天/新建的 Release：覆盖附件并刷新说明
      - name: 发布（日期 Release / 新建版本化 Release）
        if: steps.version.outputs.managed == 'true' || steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # 首次自动创建 tag 时，指向本次构建的那个提交
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ env.BUILD_DIR }}/*.pdf
          # 同名附件直接覆盖，同一天的多次 push 就是这样保持最新的
          overwrite_files: true
          fail_on_unmatched_files: true

      # 已经存在的其它版本化 Release（例如从网页发布）：只补/覆盖附件，不传 body
      - name: 只更新已有版本化 Release 的附件
        if: steps.version.outputs.managed == 'false' && steps.version.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ env.BUILD_DIR }}/*.pdf
          overwrite_files: true
          fail_on_unmatched_files: true
