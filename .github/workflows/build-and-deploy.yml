# =============================================================================
# 自动编译所有 slides/*/main.typ → PDF，部署到 GitHub Pages，并自动发版本
# （把 PDF 作为附件上传到 GitHub Release）。
#
# 目录约定：
#   slides/<名称>/main.typ  →  https://<用户名>.github.io/<仓库名>/<名称>.pdf
#   首页（自动生成的导航页）→  https://<用户名>.github.io/<仓库名>/
#
# 三个 job 各司其职，权限互不重叠：
#   build   → 装字体 + 编译 PDF（增量）+ 生成导航页 + 上传产物   （contents: read）
#   deploy  → 把 build/ 目录发布到 GitHub Pages                 （pages/id-token: write）
#   release → 自动生成版本号并创建 Release，附上全部 PDF          （contents: write）
#
# 你不需要手动打 tag：每次推送到 main 且构建成功后，release job 会自动
# 把「最新的 vX.Y.Z」的 patch 号 +1（没有则从 v1.0.0 开始）并创建 Release。
# 想指定版本号时，手动打 tag 推送即可（例如 v2.0.0），release job 会直接用它。
# =============================================================================

name: Build & Deploy Slides

on:
  push:
    branches: [main] # 推送到 main：编译 + 部署 Pages + 自动发版本
    tags: ["v*"] # 手动推送 tag：编译 + 用这个 tag 发版本（不重新部署 Pages）
  release:
    types: [published] # 在网页上「发布 Release」时也把 PDF 补传上去
  workflow_dispatch: # 支持在 Actions 页面手动运行（只构建/部署，不发版本）

env:
  # Typst 版本。锁版本可保证构建可复现；想始终用最新稳定版可改成 latest
  TYPST_VERSION: "0.15.1"
  # 编译产物目录（Pages 站点根目录）
  BUILD_DIR: build
  # push 事件的「上一次提交」，用于判断哪些幻灯片需要重新编译；
  # 其它事件（手动运行 / tag / release）取不到，会走全量编译。
  BEFORE_SHA: ${{ github.event.before }}

# 默认最小权限；需要更高权限的 job 会在下面单独声明
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) 安装字体、编译幻灯片（增量）、准备好 Pages 站点内容
  # ---------------------------------------------------------------------------
  build:
    name: 编译幻灯片
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 普通 push / 手动运行：检出触发它的那个 ref；
          # release 事件下不同来源对 github.ref 的描述不一致，这里显式优先用
          # 被发布 Release 的 tag，保证「Release 里的 PDF」就是该 tag 的代码。
          ref: ${{ github.event.release.tag_name || github.ref }}
          # 增量编译要对比「上一次提交」，所以需要完整历史（仓库很小，代价可忽略）
          fetch-depth: 0

      # 模板里指定的字体（见 slides/*/main.typ 的 #set text）：
      #   Noto Sans CJK SC → 中文；Inter → 西文；New Computer Modern Math 由 Typst 自带。
      # 不装字体也能编译成功，但中文会缺字/回退，所以这里默认装好。
      - name: 安装模板字体（Noto Sans CJK SC / Inter）
        run: |
          sudo apt-get update
          # 说明：这里故意不装 fonts-noto-cjk-extra —— 它要额外下载约 145MB，
          # 而模板只用到 Regular / Bold。若确实需要 Light / Medium 等更多中文字重，
          # 把 fonts-noto-cjk-extra 加回下面的列表即可。
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-inter \
            || sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

          # 打印实际识别到的字族，方便排查字体问题（找不到时不要让步骤失败）
          fc-list : family | grep -iE 'noto sans cjk|inter' | sort -u | head -n 10 || true

      - name: 安装 Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}
          # 可选优化：把 cache-dependency-path 指向一个「只含 @preview import 行」的
          # .typ 文件即可缓存宏包（该输入只接受单个可编译的文件，不支持通配符）。
          # 需要时见 README「进阶：缓存 @preview 宏包」一节。

      # 增量编译的核心：把上一次的 build/ 目录取回来。
      # 没改动的幻灯片直接复用里面的 PDF，只重新编译改动过的那些。
      # 只有 main 分支的 push 才走增量；tag / release / 手动运行都全量编译。
      - name: 恢复上次的编译产物（增量编译用）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}
          key: slides-build-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            slides-build-${{ github.ref_name }}-

      - name: 编译 slides/*/main.typ → build/*.pdf
        run: |
          set -uo pipefail

          build_dir="$PWD/$BUILD_DIR"
          mkdir -p "$build_dir"

          # ---------- 1) 判断这次是增量还是全量 ----------
          # 只有「push 到 main 且能拿到上一次提交」时才增量；
          # tag / release / 手动运行一律全量，保证发出去的是一份完整产物。
          full_rebuild=1
          changed=""
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] \
             && [ "${GITHUB_REF:-}" = "refs/heads/main" ] \
             && [ -n "${BEFORE_SHA:-}" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            full_rebuild=0
            changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- slides || true)"
            echo "增量编译：本次 push 改动了以下文件"
            if [ -n "$changed" ]; then printf '%s\n' "$changed" | sed 's/^/  /'; else echo "  （slides/ 下没有改动）"; fi
          else
            echo "全量编译：tag / release / 手动运行，或拿不到上一次提交"
          fi

          # ---------- 2) 逐套幻灯片编译 ----------
          names_file="$(mktemp)"
          found=0
          failed=0
          rebuilt=0
          reused=0

          for dir in slides/*/; do
            # 只处理包含 main.typ 的子目录，其他目录自动忽略
            [ -f "${dir}main.typ" ] || continue
            found=1
            name="$(basename "$dir")"
            printf '%s\n' "$name" >> "$names_file"

            # 需要重新编译：全量编译、缓存里没有这份 PDF、或该目录这次有改动
            need=1
            if [ "$full_rebuild" -eq 0 ] && [ -f "$build_dir/$name.pdf" ]; then
              if ! printf '%s\n' "$changed" | grep -qF -- "$dir"; then
                need=0
              fi
            fi

            if [ "$need" -eq 1 ]; then
              echo "::group::编译 $name"
              # 关键：先进入幻灯片所在目录再编译，
              # 这样 main.typ 里的相对路径（如 image("src/xxx.png")）才能正确解析。
              if (cd "$dir" && typst compile main.typ "$build_dir/$name.pdf"); then
                echo "✅ $name → $BUILD_DIR/$name.pdf"
                rebuilt=$((rebuilt + 1))
              else
                echo "::error::幻灯片 $name 编译失败，请检查 ${dir}main.typ"
                failed=1
              fi
              echo "::endgroup::"
            else
              echo "⏭️  $name 没有改动，复用 $BUILD_DIR/$name.pdf"
              reused=$((reused + 1))
            fi
          done

          # ---------- 3) 清理被删除 / 改名后残留的旧 PDF ----------
          for pdf in "$build_dir"/*.pdf; do
            [ -e "$pdf" ] || continue
            n="$(basename "$pdf" .pdf)"
            if ! grep -qxF -- "$n" "$names_file"; then
              echo "🧹 删除已不存在的幻灯片产物：$n.pdf"
              rm -f "$pdf"
            fi
          done
          rm -f "$names_file"

          # ---------- 4) 结果校验 ----------
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何 slides/*/main.typ，请先添加幻灯片。"
            exit 1
          fi
          # 有任何一份编译失败就终止，避免把不完整的站点发布出去
          if [ "$failed" -ne 0 ]; then
            echo "::error::存在编译失败的幻灯片，已停止后续部署。"
            exit 1
          fi

          echo "编译完成：新编译 $rebuilt 套，复用 $reused 套"
          ls -lh "$build_dir"

      - name: 生成导航页 build/index.html
        run: |
          set -euo pipefail

          {
            cat <<'HTML_HEAD'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>Slides</title>
          <style>
            :root { color-scheme: light dark; }
            body { margin: 0 auto; max-width: 46rem; padding: 2.5rem 1.25rem 4rem;
                   font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", sans-serif;
                   line-height: 1.6; }
            h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
            p.sub { margin-top: 0; opacity: 0.65; }
            ul { list-style: none; padding: 0; }
            li { margin: 0.5rem 0; }
            a { display: block; padding: 0.85rem 1rem; text-decoration: none; color: inherit;
                border: 1px solid rgba(128, 128, 128, 0.35); border-radius: 10px;
                transition: border-color 0.15s, background 0.15s; }
            a:hover { border-color: currentColor; background: rgba(128, 128, 128, 0.1); }
            a span { display: block; font-size: 0.85rem; opacity: 0.6; }
            footer { margin-top: 2.5rem; font-size: 0.85rem; opacity: 0.6; }
          </style>
          </head>
          <body>
          <h1>Slides</h1>
          <p class="sub">点击标题在线预览 PDF，或右键「另存为」下载。</p>
          <ul>
          HTML_HEAD

            # 每个 PDF 生成一个链接（文件名即 slides/ 下的文件夹名）
            for pdf in "$BUILD_DIR"/*.pdf; do
              [ -e "$pdf" ] || continue
              name="$(basename "$pdf" .pdf)"
              printf '  <li><a href="%s.pdf">%s<span>%s.pdf</span></a></li>\n' "$name" "$name" "$name"
            done

            cat <<'HTML_TAIL'
          </ul>
          <footer>本页由 GitHub Actions 自动生成；在 slides/ 下新增文件夹并推送后会自动出现在这里。</footer>
          </body>
          </html>
          HTML_TAIL
          } > "$BUILD_DIR/index.html"

          echo "已生成 $BUILD_DIR/index.html："
          cat "$BUILD_DIR/index.html"

      # 给 release job 下载用的普通产物（下载后仍是 build/xxx.pdf，便于直接用通配符上传）
      - name: 上传 PDF 产物
        uses: actions/upload-artifact@v7
        with:
          name: slides-build
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

      # 给 deploy job 用的 Pages 站点产物（整份 build/ 目录，含 index.html）
      - name: 上传 Pages 站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_DIR }}

  # ---------------------------------------------------------------------------
  # 2) 部署到 GitHub Pages
  #    只在 main 分支的 push / 手动运行（且手动运行时也选的 main）才部署；
  #    tag 推送和 release 事件只发版本，不动线上站点。
  # ---------------------------------------------------------------------------
  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 同一时间只允许一个 Pages 部署，避免并发部署互相覆盖；不打断已在进行的部署
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # 创建 Pages 部署
      id-token: write # 申请 OIDC token，验证部署来源
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  # 3) 自动发版本：算出版本号 → 创建/更新 Release → 把 PDF 全部传上去
  # ---------------------------------------------------------------------------
  release:
    name: 自动发版本并上传 PDF
    needs: build
    if: >-
      github.event_name == 'release'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    # 发布 Release 时 GitHub 会同时产生 tag push 事件，可能让本工作流跑两次并操作
    # 同一个 Release；用同一个 concurrency group 把两次运行串行化，避免并发冲突。
    concurrency:
      group: release-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # 创建 tag / Release 并上传附件
    steps:
      # tag 规则：
      #   * main 推送        → 滚动发布：固定 tag `latest`，覆盖它里面的 PDF（tag 数量恒定为 1）
      #   * 手动推送 v* tag   → 用该 tag 建一个正式的版本化 Release（与 latest 共存）
      #   * release 事件      → 只给那个 Release 补附件，不动说明
      - name: 计算 tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag=""
          rolling=false

          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ -n "${RELEASE_TAG}" ]; then
            tag="${RELEASE_TAG}"
            echo "使用 Release 自带的 tag：${tag}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "使用本次推送的 tag：${tag}"
          else
            # 日常 push：更新同一个滚动 Release，不新增 tag
            tag="latest"
            rolling=true
            echo "滚动发布：把 PDF 更新到 ${tag} Release"
          fi

          # 该 Release 是否已存在：
          #   false → 本次新建，可以写一份自动说明
          #   true  → 已存在；滚动发布刷新说明，版本化 Release 只补附件
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "Release ${tag} 是否已存在：${exists}"

          {
            echo "tag=${tag}"
            echo "rolling=${rolling}"
            echo "exists=${exists}"
          } >> "$GITHUB_OUTPUT"

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: slides-build
          path: ${{ env.BUILD_DIR }}

      # 生成说明：滚动的 latest Release 每次都刷新；
      # 版本化 Release 只在新建时写一次，已存在时绝不动你手写的说明。
      - name: 生成 Release 说明
        if: steps.version.outputs.rolling == 'true' || steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ROLLING: ${{ steps.version.outputs.rolling }}
        run: |
          set -euo pipefail
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          {
            if [ "${ROLLING}" = "true" ]; then
              echo "🔄 **这是自动滚动更新的最新版**：每次 push 到 \`main\` 都会把下面的 PDF 换成最新编译结果，本 Release 的 tag 固定为 \`${TAG}\`。"
              echo
            fi
            echo "包含以下幻灯片（左侧链接在线预览，右侧链接直接下载）："
            echo
            for pdf in "$BUILD_DIR"/*.pdf; do
              [ -e "$pdf" ] || continue
              name="$(basename "$pdf")"
              echo "- [\`${name}\`](${site}/${name}) · [下载](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name})"
            done
            echo
            echo "站点首页：<${site}/>"
            echo
            echo "<sub>由 GitHub Actions 自动生成 · 提交 \`${GITHUB_SHA:0:7}\`</sub>"
          } > "$RUNNER_TEMP/release-notes.md"

          cat "$RUNNER_TEMP/release-notes.md"

      # 滚动 latest（覆盖附件 + 刷新说明）或新建版本化 Release
      - name: 发布（滚动 latest / 新建版本化 Release）
        if: steps.version.outputs.rolling == 'true' || steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # 首次自动创建 tag 时，指向本次构建的那个提交
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ env.BUILD_DIR }}/*.pdf
          # 同名附件直接覆盖，滚动 Release 就是这样保持最新的
          overwrite_files: true
          fail_on_unmatched_files: true

      # 已经存在的版本化 Release（例如从网页发布）：只补/覆盖附件，不传 body
      - name: 只更新已有版本化 Release 的附件
        if: steps.version.outputs.rolling == 'false' && steps.version.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ env.BUILD_DIR }}/*.pdf
          overwrite_files: true
          fail_on_unmatched_files: true
