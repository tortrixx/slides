# =============================================================================
# 自动编译所有 slides/*/main.typ → PDF，部署到 GitHub Pages，并自动发版本
# （把 PDF 作为附件上传到 GitHub Release）。
#
# 目录约定：
#   slides/<名称>/main.typ  →  https://<用户名>.github.io/<仓库名>/<名称>.pdf
#   首页（自动生成的导航页）→  https://<用户名>.github.io/<仓库名>/
#
# 三个 job 各司其职，权限互不重叠：
#   build   → 装字体 + 编译 PDF（增量）+ 生成导航页 + 上传产物   （contents: read）
#   deploy  → 把 build/ 目录发布到 GitHub Pages                 （pages/id-token: write）
#   release → 按日期发版并创建 Release，附上全部 PDF             （contents: write）
#
# 你不需要手动打 tag：每次推送到 main 且构建成功后，release job 会用
# 当天日期（默认 Asia/Shanghai，见 RELEASE_TZ）创建/更新 Release，例如 v2026.09.30。
# 同一天多次 push 只刷新这一个 Release 的 PDF，不会新增 tag；跨天自动新建。
# 想额外留一个正式快照时，手动打 tag 推送即可（例如 v2.0.0）。
# =============================================================================

name: Build & Deploy Slides

on:
  push:
    branches: [main] # 推送到 main：编译 + 部署 Pages + 自动发版本
    tags: ["v*"] # 手动推送 tag：编译 + 用这个 tag 发版本（不重新部署 Pages）
  release:
    types: [published] # 在网页上「发布 Release」时也把 PDF 补传上去
  workflow_dispatch: # 支持在 Actions 页面手动运行（只构建/部署，不发版本）

env:
  # Typst 版本。锁版本可保证构建可复现；想始终用最新稳定版可改成 latest
  TYPST_VERSION: "0.15.1"
  # 编译产物目录（Pages 站点根目录）
  BUILD_DIR: build
  # 按日期发版时用哪个时区决定 tag 里的日期（想用 UTC 就写 UTC）
  RELEASE_TZ: "Asia/Shanghai"
  # push 事件的「上一次提交」，用于判断哪些幻灯片需要重新编译；
  # 其它事件（手动运行 / tag / release）取不到，会走全量编译。
  BEFORE_SHA: ${{ github.event.before }}

# 默认最小权限；需要更高权限的 job 会在下面单独声明
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) 安装字体、编译幻灯片（增量）、准备好 Pages 站点内容
  # ---------------------------------------------------------------------------
  build:
    name: 编译幻灯片
    runs-on: ubuntu-latest
    # 删除 tag / 分支同样会产生 push 事件（deleted: true）。必须忽略，
    # 否则删掉 v2026.09.30 之后工作流会认为「该版本不存在」而把它重新创建出来。
    if: github.event.deleted != true
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 普通 push / 手动运行：检出触发它的那个 ref；
          # release 事件下不同来源对 github.ref 的描述不一致，这里显式优先用
          # 被发布 Release 的 tag，保证「Release 里的 PDF」就是该 tag 的代码。
          ref: ${{ github.event.release.tag_name || github.ref }}
          # 增量编译要对比「上一次提交」，所以需要完整历史（仓库很小，代价可忽略）
          fetch-depth: 0

      # 模板里指定的字体（见 slides/*/main.typ 的 #set text）：
      #   Noto Sans CJK SC → 中文；Inter → 西文；New Computer Modern Math 由 Typst 自带。
      # 不装字体也能编译成功，但中文会缺字/回退，所以这里默认装好。
      - name: 安装模板字体（Noto Sans CJK SC / Inter）
        run: |
          sudo apt-get update
          # 说明：这里故意不装 fonts-noto-cjk-extra —— 它要额外下载约 145MB，
          # 而模板只用到 Regular / Bold。若确实需要 Light / Medium 等更多中文字重，
          # 把 fonts-noto-cjk-extra 加回下面的列表即可。
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-inter \
            || sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

          # 打印实际识别到的字族，方便排查字体问题（找不到时不要让步骤失败）
          fc-list : family | grep -iE 'noto sans cjk|inter' | sort -u | head -n 10 || true

      - name: 安装 Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}
          # 可选优化：把 cache-dependency-path 指向一个「只含 @preview import 行」的
          # .typ 文件即可缓存宏包（该输入只接受单个可编译的文件，不支持通配符）。
          # 需要时见 AGENTS.md 第 8 节「可能的后续改进」。

      # 增量编译的核心：把上一次的 build/ 目录取回来。
      # 没改动的幻灯片直接复用里面的 PDF，只重新编译改动过的那些。
      # 只有 main 分支的 push 才走增量；tag / release / 手动运行都全量编译。
      - name: 恢复上次的编译产物（增量编译用）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}
          key: slides-build-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            slides-build-${{ github.ref_name }}-

      - name: 编译 slides/*/main.typ → build/*.pdf
        run: |
          set -uo pipefail

          build_dir="$PWD/$BUILD_DIR"
          mkdir -p "$build_dir"

          # ---------- 1) 判断这次是增量还是全量 ----------
          # 只有「push 到 main 且能拿到上一次提交」时才增量；
          # tag / release / 手动运行一律全量，保证发出去的是一份完整产物。
          full_rebuild=1
          changed=""
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] \
             && [ "${GITHUB_REF:-}" = "refs/heads/main" ] \
             && [ -n "${BEFORE_SHA:-}" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            full_rebuild=0
            changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- slides || true)"
            echo "增量编译：本次 push 改动了以下文件"
            if [ -n "$changed" ]; then printf '%s\n' "$changed" | sed 's/^/  /'; else echo "  （slides/ 下没有改动）"; fi
          else
            echo "全量编译：tag / release / 手动运行，或拿不到上一次提交"
          fi

          # ---------- 2) 逐套幻灯片编译 ----------
          names_file="$(mktemp)"
          found=0
          failed=0
          rebuilt=0
          reused=0

          for dir in slides/*/; do
            # 只处理包含 main.typ 的子目录，其他目录自动忽略
            [ -f "${dir}main.typ" ] || continue
            found=1
            name="$(basename "$dir")"

            # 文件夹名会直接变成 URL 路径（<名称>.pdf）和首页链接，所以限制字符集：
            # 允许汉字 / 字母 / 数字 / 点 / 下划线 / 连字符，其它 ASCII 字符（空格、引号、
            # & # ? 等）会让链接或 Markdown 说明出问题，直接报错让人改名。
            # 做法：删掉允许的 ASCII 与所有高位字节（UTF-8 汉字由高位字节组成），还剩东西就是非法字符。
            unsafe="$(printf '%s' "$name" | LC_ALL=C tr -d 'A-Za-z0-9._-' | LC_ALL=C tr -d '\200-\377')"
            if [ -n "$unsafe" ]; then
              # 用 %q 把空格、引号之类的字符显示出来（否则报错里看不出是哪个字符）
              echo "::error::文件夹名 ${name} 含不安全的字符（$(printf '%q' "$unsafe")），请只用汉字/字母/数字/点/下划线/连字符"
              failed=1
              continue
            fi

            printf '%s\n' "$name" >> "$names_file"

            # 需要重新编译：全量编译、缓存里没有这份 PDF、或该目录这次有改动
            need=1
            if [ "$full_rebuild" -eq 0 ] && [ -f "$build_dir/$name.pdf" ]; then
              if ! printf '%s\n' "$changed" | grep -qF -- "$dir"; then
                need=0
              fi
            fi

            if [ "$need" -eq 1 ]; then
              echo "::group::编译 $name"
              # 关键：先进入幻灯片所在目录再编译，
              # 这样 main.typ 里的相对路径（如 image("src/xxx.png")）才能正确解析。
              if (cd "$dir" && typst compile main.typ "$build_dir/$name.pdf"); then
                echo "✅ $name → $BUILD_DIR/$name.pdf"
                rebuilt=$((rebuilt + 1))
              else
                echo "::error::幻灯片 $name 编译失败，请检查 ${dir}main.typ"
                failed=1
              fi
              echo "::endgroup::"
            else
              echo "⏭️  $name 没有改动，复用 $BUILD_DIR/$name.pdf"
              reused=$((reused + 1))
            fi
          done

          # ---------- 3) 清理被删除 / 改名后残留的旧 PDF ----------
          for pdf in "$build_dir"/*.pdf; do
            [ -e "$pdf" ] || continue
            n="$(basename "$pdf" .pdf)"
            if ! grep -qxF -- "$n" "$names_file"; then
              echo "🧹 删除已不存在的幻灯片产物：$n.pdf"
              rm -f "$pdf"
            fi
          done
          rm -f "$names_file"

          # ---------- 4) 结果校验 ----------
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何 slides/*/main.typ，请先添加幻灯片。"
            exit 1
          fi
          # 有任何一份编译失败就终止，避免把不完整的站点发布出去
          if [ "$failed" -ne 0 ]; then
            echo "::error::存在编译失败的幻灯片，已停止后续部署。"
            exit 1
          fi

          echo "编译完成：新编译 $rebuilt 套，复用 $reused 套"
          ls -lh "$build_dir"

      - name: 生成导航页 build/index.html
        run: |
          set -euo pipefail

          template="index.template.html"
          [ -f "$template" ] || { echo "::error::缺少首页模板 ${template}"; exit 1; }

          # ---------- 1) 为每套幻灯片生成一张卡片 ----------
          items="$RUNNER_TEMP/slides-items.html"
          : > "$items"
          count=0

          # 取 main.typ 里 config-info 的 title / subtitle（取不到就退回文件夹名）
          # 先按「键单独占一行」匹配；不中再按单行写法匹配（要求键前面不是字母/下划线，
          # 否则 subtitle: 里的 title: 会被误匹配成标题——实测踩过）
          pick() {
            local value
            value="$(sed -nE "s/^[[:space:]]*$2:[[:space:]]*\[([^]]*)\].*/\1/p" "$1" | head -n 1)"
            if [ -z "$value" ]; then
              value="$(sed -nE "s/.*[^[:alnum:]_]$2:[[:space:]]*\[([^]]*)\].*/\1/p" "$1" | head -n 1)"
            fi
            printf '%s' "$value"
          }
          escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          for dir in slides/*/; do
            [ -f "${dir}main.typ" ] || continue
            name="$(basename "$dir")"
            pdf="$BUILD_DIR/$name.pdf"
            [ -e "$pdf" ] || continue
            count=$((count + 1))

            title="$(pick "${dir}main.typ" title)"
            [ -n "$title" ] || title="$name"

            subtitle="$(pick "${dir}main.typ" subtitle)"
            [ -n "$subtitle" ] || subtitle="点击卡片在线预览，或右键「另存为」下载"

            bytes="$(wc -c < "$pdf" | tr -d ' ')"
            if [ "$bytes" -ge 1048576 ]; then
              size="$(awk -v b="$bytes" 'BEGIN { printf "%.1f MB", b / 1048576 }')"
            else
              size="$(awk -v b="$bytes" 'BEGIN { printf "%.0f KB", b / 1024 }')"
            fi

            title_html="$(printf '%s' "$title" | escape)"
            subtitle_html="$(printf '%s' "$subtitle" | escape)"
            name_html="$(printf '%s' "$name" | escape)"

            # 卡片结构对应 index.template.html 里的 .deck 样式
            cat <<HTML >> "$items"
                  <div class="deck fade" style="--i: $count">
                    <span class="bar"></span>
                    <div class="deck-main">
                      <a class="deck-title" href="${name_html}.pdf" target="_blank" rel="noreferrer">
                        ${title_html}
                        <svg class="ext" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
                      </a>
                      <div class="deck-desc">${subtitle_html}</div>
                      <div class="deck-meta">
                        <span class="badge">PDF</span>
                        <span class="badge">${size}</span>
                        <span class="file">${name_html}.pdf</span>
                      </div>
                    </div>
                    <span class="beam"></span>
                  </div>
          HTML
          done

          # ---------- 2) 把生成结果套进模板 ----------
          meta="最后更新 $(TZ="${RELEASE_TZ}" date '+%Y-%m-%d %H:%M') · 提交 ${GITHUB_SHA:0:7}"

          awk -v items="$items" -v count="$count" -v meta="$meta" '
            /<!--SLIDES-->/ { while ((getline line < items) > 0) print line; close(items); next }
            /<!--COUNT-->/  { sub(/<!--COUNT-->/, count); print; next }
            /<!--META-->/   { sub(/<!--META-->/, meta); print; next }
            { print }
          ' "$template" > "$BUILD_DIR/index.html"

          echo "已生成 $BUILD_DIR/index.html（$count 套幻灯片，$(wc -c < "$BUILD_DIR/index.html" | tr -d ' ') bytes）"

      # 给 release job 下载用的普通产物（下载后仍是 build/xxx.pdf，便于直接用通配符上传）
      # 只在同一次运行内被用到，保留 1 天即可，避免堆积（Pages 那份也是 1 天）
      - name: 上传 PDF 产物
        uses: actions/upload-artifact@v7
        with:
          name: slides-build
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 1

      # 给 deploy job 用的 Pages 站点产物（整份 build/ 目录，含 index.html）
      - name: 上传 Pages 站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_DIR }}

  # ---------------------------------------------------------------------------
  # 2) 部署到 GitHub Pages
  #    只在 main 分支的 push / 手动运行（且手动运行时也选的 main）才部署；
  #    tag 推送和 release 事件只发版本，不动线上站点。
  # ---------------------------------------------------------------------------
  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 同一时间只允许一个 Pages 部署，避免并发部署互相覆盖；不打断已在进行的部署
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # 创建 Pages 部署
      id-token: write # 申请 OIDC token，验证部署来源
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  # 3) 按日期发版：算出当天的 tag → 创建/更新 Release → 把 PDF 全部传上去
  # ---------------------------------------------------------------------------
  release:
    name: 自动发版本并上传 PDF
    needs: build
    if: >-
      github.event.deleted != true
      && (github.event_name == 'release'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    # 发布 Release 时 GitHub 会同时产生 tag push 事件，可能让本工作流跑两次并操作
    # 同一个 Release；用同一个 concurrency group 把两次运行串行化，避免并发冲突。
    concurrency:
      group: release-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # 创建 tag / Release 并上传附件
    steps:
      # tag 规则：
      #   * main 推送        → 按日期命名，例如 v2026.09.30；
      #                        同一天再 push 只更新这个 Release 的附件，不会新增 tag
      #   * 手动推送 v* tag   → 用该 tag 建一个额外的版本化 Release（与你手动的 tag 同名）
      #   * release 事件      → 只给那个 Release 补附件，不动说明
      - name: 计算 tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag=""
          managed=false

          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ -n "${RELEASE_TAG}" ]; then
            tag="${RELEASE_TAG}"
            echo "使用 Release 自带的 tag：${tag}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "使用本次推送的 tag：${tag}"
          else
            # 日常 push：按日期命名，同一天只维护一个 Release
            tag="v$(TZ="${RELEASE_TZ}" date +%Y.%m.%d)"
            managed=true
            echo "按日期发版：${tag}（同一天的多次 push 只更新这一个 Release）"
          fi

          # 该 Release 是否已存在：
          #   false → 本次新建，可以写一份自动说明
          #   true  → 已存在；当天再次 push 时刷新说明，其它版本化 Release 只补附件
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "Release ${tag} 是否已存在：${exists}"

          {
            echo "tag=${tag}"
            echo "managed=${managed}"
            echo "exists=${exists}"
          } >> "$GITHUB_OUTPUT"

      - name: 下载编译产物
        uses: actions/download-artifact@v8
        with:
          name: slides-build
          path: ${{ env.BUILD_DIR }}

      # 生成说明：按日期维护的那个 Release 每次都刷新；
      # 其它版本化 Release 只在新建时写一次，已存在时绝不动你手写的说明。
      - name: 生成 Release 说明
        if: steps.version.outputs.managed == 'true' || steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MANAGED: ${{ steps.version.outputs.managed }}
        run: |
          set -euo pipefail
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          {
            if [ "${MANAGED}" = "true" ]; then
              echo "📅 **本 Release 按日期维护（\`${TAG}\`）**：同一天的多次 push 会刷新下面的 PDF；跨天后会自动新建一个日期版本。"
              echo
            fi
            echo "包含以下幻灯片（左侧链接在线预览，右侧链接直接下载）："
            echo
            for pdf in "$BUILD_DIR"/*.pdf; do
              [ -e "$pdf" ] || continue
              name="$(basename "$pdf")"
              echo "- [\`${name}\`](${site}/${name}) · [下载](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name})"
            done
            echo
            echo "站点首页：<${site}/>"
            echo
            echo "<sub>由 GitHub Actions 自动生成 · 提交 \`${GITHUB_SHA:0:7}\`</sub>"
          } > "$RUNNER_TEMP/release-notes.md"

          cat "$RUNNER_TEMP/release-notes.md"

      # 当天/新建的 Release：覆盖附件并刷新说明
      - name: 发布（日期 Release / 新建版本化 Release）
        if: steps.version.outputs.managed == 'true' || steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # 首次自动创建 tag 时，指向本次构建的那个提交
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ env.BUILD_DIR }}/*.pdf
          # 同名附件直接覆盖，同一天的多次 push 就是这样保持最新的
          overwrite_files: true
          fail_on_unmatched_files: true

      # 已经存在的其它版本化 Release（例如从网页发布）：只补/覆盖附件，不传 body
      - name: 只更新已有版本化 Release 的附件
        if: steps.version.outputs.managed == 'false' && steps.version.outputs.exists == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ env.BUILD_DIR }}/*.pdf
          overwrite_files: true
          fail_on_unmatched_files: true
