<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <!--
      站点首页模板。
      构建时 workflow 会替换三处占位注释（SLIDES / COUNT / META），产物是 build/index.html。
      **本文件里千万别写出占位符的原文**（SLIDES / COUNT / META）：workflow 的 awk 是**按行**
      替换、不认 HTML 注释，写出原文的那一行会被整行换掉（SLIDES 那处 → 整行变成卡片列表、
      塞进注释中间；COUNT 那处 → 就地变成数字）。真发生过：本注释里写过 COUNT 的原文，
      产物里那句成了「注意 2 现在模板里没有用了」。所以下面只写名字、不写原文。
      COUNT 现在**模板里没有用到**（标题旁的套数已去掉），workflow 的替换规则留着 ——
      想恢复显示就把它写回 h1 里，不用碰 YAML。
      其中 SLIDES 是服务端渲染出来的幻灯片卡片，所以不依赖 JS；JS 只负责深浅色。
      主题是三态循环，右上角按钮依次切 auto → 浅色 → 深色 → auto：
        * auto（默认）：每次加载都重新读浏览器的 prefers-color-scheme，系统切换时实时跟随；
        * 浅色 / 深色：用户明确选过才写进 localStorage 固定下来（auto 会清掉那个键）。
      按钮的图标跟着模式换：浅色=太阳、深色=月亮、自动=半明半暗的圆（三者只显示一个）。
      所以「第一次打开按浏览器、之后每次刷新也按浏览器」在不手动干预时始终成立。
      JS 被禁用时没有 .dark，页面恒为浅色，内容与链接不受影响。
      样式沿用 tortrixx/tortrixx（Astro + shadcn + magicui）的视觉语言：
      等宽字体、中性色阶、虚线网格背景、hover 光边框、淡入、深浅色切换。
      想改样式直接改本文件的 <style>，也可以在本地打开它预览整体版式（卡片区会是空的）。
      注意：charset 必须留在文件最前面（1024 字节内），别把这段注释挪到它前面。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slides · tortrixx</title>
    <meta
      name="description"
      content="tortrixx 的幻灯片集合：用 Typst + Touying 编写，推送后自动编译为 PDF。"
    />
    <!-- 分享到聊天/社交平台时显示的文字卡片（没有配图，所以用 summary 而不是大图卡片） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Slides · tortrixx" />
    <meta
      property="og:description"
      content="tortrixx 的幻灯片集合：用 Typst + Touying 编写，推送后自动编译为 PDF。"
    />
    <meta name="twitter:card" content="summary" />
    <!-- 地址栏/滚动条等浏览器自带界面跟随系统偏好；用户手动切过之后则由下方的 JS 改写 -->
    <meta name="color-scheme" content="light dark" />
    <!-- 这两条按系统偏好给浏览器 UI 上色（无 JS 时的兜底）；
         有 JS 时上方脚本会摘掉 media 并改写 content，让它跟"实际生效的主题"一致，
         否则手动固定浅/深之后地址栏颜色会和页面对不上 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090B" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2318181b'/%3E%3Crect x='3' y='3.6' width='10' height='1.6' rx='.8' fill='%23fafafa'/%3E%3Crect x='3' y='7.2' width='10' height='1.6' rx='.8' fill='%23fafafa'/%3E%3Crect x='3' y='10.8' width='6' height='1.6' rx='.8' fill='%23fafafa'/%3E%3C/svg%3E"
    />
    <style>
      /* ---------- 设计变量（与 shadcn 的 neutral 主题一致） ---------- */
      :root {
        --background: 0 0% 100%;
        --foreground: 0 0% 3.9%;
        --secondary: 0 0% 94%;
        --muted-foreground: 0 0% 45.1%;
        --border: 0 0% 89.8%;
        --radius: 0.5rem;
        --accent-blue: #60a5fa;
        --accent-yellow: #facc15;
      }
      .dark {
        --background: 0 0% 3.9%;
        --foreground: 0 0% 98%;
        --secondary: 0 0% 14.9%;
        --muted-foreground: 0 0% 63.9%;
        --border: 0 0% 25.1%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-color: hsl(var(--border));
      }

      /* 背景必须设在根元素上：html 铺满整个视口，所以页面比内容高时下面也是对的颜色。
         曾经只把 background 设在 body 上 —— Chrome 会把 body 背景提升成画布背景，
         但 Safari 不会（body 只有 width:90%、不是全宽矩形），于是内容高度以下露出一条
         浅色，深色模式下特别明显（用户截图报过）。 */
      html {
        color-scheme: light;
        background: hsl(var(--background));
        /* 给 body 一个百分比高度的参照，视口高度链才完整
           （只在 body 上写 min-height:100vh 时，Safari 里固定定位那层仍可能只覆盖内容高度） */
        height: 100%;
      }
      html.dark {
        color-scheme: dark;
      }
      /* 上面两条是「跟随系统/无 JS」时的兜底；用户手动切过之后，JS 会用行内
         color-scheme（优先级更高）把它改成实际主题 */

      body {
        /* 竖直方向用 flex 撑满视口：main 吃掉剩余高度，页脚就落在「页面最下方」（见 main / footer） */
        display: flex;
        flex-direction: column;
        position: relative;
        margin: 0 auto;
        width: 90%;
        max-width: 48rem;
        padding: 1.25rem 0 2.5rem;
        /* 这里**不要**再设 background：根元素已经有背景、已经铺满视口，
           而 .bg-grid 是 z-index:-1 —— 它画在根背景之上、但在 body 背景之下，
           body 一旦有不透明背景就会把网格整片盖掉（实测：下半区灰度标准差 0.46 → 去掉后 2.89）。
           min-height 仍然要留：让 body 占满视口高度，
           .bg-grid 那层 position:fixed + height:100% 的百分比才有参照。 */
        min-height: 100vh;
        color: hsl(var(--foreground));
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Roboto Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono", monospace;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      @media (min-width: 640px) {
        body {
          padding-top: 2.5rem;
        }
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* ---------- 背景：虚线网格 + 中心径向遮罩 ---------- */
      .bg-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.6), transparent);
        mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.6), transparent);
      }
      .bg-grid path {
        stroke: rgb(156 163 175 / 0.3);
      }

      /* ---------- 淡入（对应 magicui 的 BlurFade） ---------- */
      @keyframes blur-fade {
        from {
          opacity: 0;
          transform: translateY(8px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      .fade {
        animation: blur-fade 0.35s ease-out both;
        /* 错峰上限 8 档：deck 很多时否则要等好几秒才全部出现 */
        animation-delay: calc(0.04s + min(var(--i, 0), 8) * 0.1s);
      }

      /* ---------- 顶栏 ---------- */
      /* 顶栏 = 头像 + 页面主标题（h1）+ 右上角按钮，一行（窄屏纵向堆叠）。
         原来这里是「头像 + 标语（Less noise, more signal.）」一行，下面再单独一行 `h2 Slides`；
         去掉标语、把 `Slides` 提上来当 h1 的理由见 AGENTS.md「首页视觉」。
         **别把唯一的 h1 弄丢**（无 h1 对读屏与搜索都不友好），要改标题就改 `.page-title` 这一处。 */
      header {
        /* 1.5rem = 24px：与 `.deck` 的 padding-top 相加后，页眉线到第一行墨迹实测 42px，
           比行距（线到两侧墨迹各 ~17px）大一档 —— 区块边界与条目之间"边界更松"。
           改之前是 1.25rem：线到第一行只有 33.9px，而行距是 23.5px，方向正好反过来
           （线离内容比行距还近），层级就发黏了。 */
        margin-bottom: 1.5rem;
      }
      .head-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding-bottom: 1rem;
        /* **2px，行线是 1px** —— 两条线必须"重量"不同，这是区块边界与条目分隔的分层手段。
           原来两条都是 1px + 同色，只有"两端渐隐"这点差别（肉眼看不出来），所以页眉线看着
           跟行线同一级（用户 2026-10 提的「显示效果也差不多」）。
           配合 `header` 的 margin-bottom 后实测：线在 64px 头像之下 18px、到第一行墨迹
           42px（页眉区最高的元素是头像，不是 1.5rem 的标题——按标题的行盒算会得出 30.8px，
           那 12px 是 h1 行高里上下各约 7px 的 half-leading，不是观感距离）。 */
        border-bottom: 2px solid hsl(var(--border));
      }
      @media (min-width: 640px) {
        .head-row {
          flex-direction: row;
          /* 居中对齐：80px 的头像和一行标题按底对齐会显得标题在往下掉 */
          align-items: center;
          gap: 0;
        }
      }
      .avatar {
        height: 64px;
        width: 64px;
        flex: none;
        border-radius: 9999px;
        transition: transform 0.3s ease;
      }
      .avatar:hover {
        transform: rotate(180deg);
      }
      /* 页面主标题（h1）。字号比原来的区块标题大一档，因为现在它就是这一页的标题。 */
      .page-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
        font-size: 1.5rem;
        /* 字重 **500 = 意图 medium**：这套字体栈只有 regular + bold 两档（实测 400 与 500
           渲染完全一致、600 与 700 都是 bold），medium 在这套字体里根本不存在。写 500 在本机
           落 regular，将来若自持 Roboto Mono Variable 就自然变成真 medium。
           **别再改回 600**（在当前环境里就是 bold，用户明确说"过粗"了）—— 实测数据与自持
           字体的三步做法都在 AGENTS.md「首页视觉」。 */
        font-weight: 500;
        /* **不要给标题加 text-decoration: underline**：① 参考站全站没有 underline，而且标题
           下方已经有 .head-row 的通栏 border-bottom 收口，再加是重复装饰；② 真踩过的坑 ——
           `.page-title` 是 flex 容器，里面的 `.count` 会被 **blockify**，于是祖先的下划线会
           **传播进后代**、后代写 `text-decoration: none` 撤不掉（用户报过"Slides 和 2 都带
           下划线"）。真要加，只能把文字包进内层 `<span>` 再把下划线加在它身上。 */
      }
      @media (min-width: 640px) {
        .page-title {
          margin-left: 1.5rem;
        }
      }
      .spacer {
        flex: 1;
      }
      .head-actions {
        display: flex;
        align-items: center;
      }
      .icon-btn {
        margin-right: 0.25rem;
        padding: 5px;
        border: 0;
        border-radius: 0.375rem;
        background: transparent;
        color: hsl(var(--muted-foreground));
        cursor: pointer;
        transition: background-color 0.2s, color 0.2s;
      }
      .icon-btn:hover {
        background: hsl(var(--secondary));
        color: hsl(var(--foreground));
      }
      .icon-btn svg {
        display: block;
        height: 22px;
        width: 22px;
      }
      /* 三种模式各配一个图标，只显示当前那个：
         太阳 = 浅色、半明半暗的圆 = 自动跟随系统、月亮 = 深色。
         （半明半暗是「自动/对比度」的经典符号，比在太阳/月亮角上加小点更干净，
          三个图标分量也相当。）按钮在 HTML 里就带着 data-mode="auto"，所以**无 JS 时显示的是
         「自动」图标**（按钮此时点了没反应，页面恒为浅色）。最后那条 `:not([data-mode])` 规则
         只是兜底：万一以后有人把属性去掉，至少还显示太阳而不是一个图标都没有。

         写法上让**默认全部隐藏**（.icon-sun 也一起隐藏），只由「当前模式」那条规则
         打开一个 —— 这样任何情况下最多只有一个图标可见，不会出现太阳和月亮同时画出、
         叠在一起（曾经用「基础的 display:none + 两条按模式覆盖」的写法，深色下太阳没被
         藏住，两个图标就叠在一起了；这种「只显式打开一个」的写法从结构上排除该问题）。 */
      .icon-sun,
      .icon-auto,
      .icon-moon {
        display: none;
      }
      [data-mode="light"] .icon-sun,
      [data-mode="dark"] .icon-moon,
      [data-mode="auto"] .icon-auto,
      .icon-btn:not([data-mode]) .icon-sun {
        display: block;
      }
      /* 太阳与月亮是实心字形；显示哪一个完全由上面的 data-mode 决定，
         不再靠 fill 透明来「关灯」，所以 hover 变色（currentColor）能正常跟随。 */
      .icon-sun,
      .icon-moon {
        fill: currentColor;
      }
      .gh {
        display: flex;
        align-items: center;
        padding: 5px;
        border-radius: 0.375rem;
        color: hsl(var(--muted-foreground));
        transition: background-color 0.2s, color 0.2s;
      }
      .gh:hover {
        background: hsl(var(--secondary));
        color: hsl(var(--foreground));
      }

      /* ---------- 区块 ---------- */
      main {
        /* 1 0 auto：内容少时把剩余高度全部吃掉，页脚因此贴到页面底部；
           内容多时按内容自然增长，页脚仍旧跟在卡片之后（不会盖住内容） */
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      /* 这一页只有一个区块：主标题（h1 `Slides`）在顶栏，这里**不再有区块标题 `h2`**。
         以后若真按年/主题分组，再给每组加一条 h2（字号 1.125rem 一档，比主标题小）。
         标题旁那个套数胶囊（`.count`）2026-10 跟着套数一起去掉了；要恢复就照当年写回来：
         `display: inline-block; padding: 0 0.5rem; border: 1px solid hsl(var(--border));
         border-radius: 9999px; color: hsl(var(--muted-foreground)); font-size: 0.75rem;`
         **但别指望 `text-decoration: none` 能挡掉祖先的下划线**：父级是 flex 容器时这个
         span 会被 blockify，下划线照样画进来（踩坑记录见 AGENTS.md）。 */

      /* ---------- 幻灯片列表 ---------- */
      /* 版式是「纯列表」：一行一套，行内标题/副标题/元信息，行间一条细线。三件**别改**的事：
           * 行内不要再加色条（原站那根红条是**分组标题**的标记，按行复制就成了满屏粉条）；
           * hover 必须是**整行**（`.deck` 是 `width: 100%`）—— 有了行线之后，贴合式灰块的
             右边缘和行线对不齐就是"脏"；
           * 顺序「最新在前」由 workflow 按 git 提交日期在构建时排好，**日期不上页面**
             （它说的是"这套 deck 上次提交"，不是内容日期；真想透出"新旧"，更轻的做法是给
             最近改过的行加个小圆点，而不是恢复整列日期）。
         完整的历史与外部依据见 AGENTS.md「首页视觉」。 */
      .deck {
        position: relative;
        display: flex;
        width: 100%;
        /* 行距比正文节奏再松一档：Primer 的 action list 明确写了「用条目分隔线时，同时把行高
           放大一点有助于可读性」——线越清楚、行越挤，就越像表格，这是刻意防它变表格。 */
        /* 上下内边距做成**近似相等**（15px / 14px）：行线是 `.deck + .deck::before` 画的
           1px 线，落在上一行的 padding-bottom 与下一行的 padding-top 之间，两者不等就会
           "线偏上"。实测（第二行带副标题、最高的一行）：线到上一行墨迹 14px、到下一行墨迹
           18px；旧值 0.68rem / 0.6rem = 10.9px / 9.6px 时偏差更大，线明显偏上。
           注意这两个数从 `getBoundingClientRect()` 量出来是行盒，观感差的是**墨迹**到线，
           两者差 3–4px（12–18px 的字，行高里有 half-leading），别只按行盒调。 */
        padding: 0.9375rem 0.5rem 0.875rem;
        border-radius: var(--radius);
        transition: background-color 0.3s ease;
      }
      /* 行与行之间一条**两端渐隐**的细线（2026-10 定稿）。
         只能用伪元素 + `background-image`：`.deck` 是圆角盒子，`border-top` 会在两端跟着圆角
         拐弯，而且**渐变画不进 border** —— **别改回 `border-top`**。
         为什么是渐隐（而不是"两端各内缩 0.5rem + 半透明"）：页眉下面那条（`.head-row` 的
         border-bottom）是**区块边界**（通栏实线、两端到头），行线只要也是"硬端点"就还在跟它
         比长短、层级发黏；渐隐之后行线是"一段化开的毛发线"，靠**质感**分层而不是长度。
         Material 3 / iOS `separatorInset` / Primer / 参考站这几条依据见 AGENTS.md「首页视觉」。 */
      .deck + .deck::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background-image: linear-gradient(
          to right,
          transparent,
          hsl(var(--border)) 12%,
          hsl(var(--border)) 88%,
          transparent
        );
      }
      .deck:hover {
        background: hsl(var(--secondary));
      }
      .deck-main {
        min-width: 0;
        flex: 1;
      }
      .deck-title {
        display: inline-flex;
        align-items: flex-end;
        /* 标题要**真的像标题**：原来这里是继承正文的 16px / 400，三级（16/14/12px）全是
           regular、层级只靠颜色撑着 —— 结果一行里"最有形状"的东西变成了两个描边胶囊
           （见下面 .deck-meta，用户提的就是这个）。现在 18px + 500（意图 medium，理由同
           .page-title 那条），层级由**字号 + 颜色**承担（18px 纯黑 / 14px 灰 / 12px 灰），
           hover 再补下划线。 */
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1;
        text-underline-offset: 4px;
        transition: transform 0.3s ease;
      }
      .deck:hover .deck-title {
        transform: translateY(-2px);
        text-decoration: underline;
      }
      .deck-title .ext {
        margin-left: 1.5rem;
        opacity: 0;
        transform: translateX(-1.5rem);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .deck:hover .deck-title .ext,
      .deck:focus-within .deck-title .ext {
        opacity: 1;
        transform: translateX(0);
      }
      .deck-desc {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: hsl(var(--muted-foreground));
        transition: color 0.3s ease;
      }
      .deck:hover .deck-desc {
        color: hsl(var(--foreground));
      }
      /* 副信息行 = 一句话的"规格说明"：`49 页 · 748 KB · 26-09-30.pdf`。
         **别再给页数/大小加边框或胶囊**（2026-10 用户提的「别抢标题注意力」，详见 AGENTS.md
         「首页视觉」）：整页带 1px 边框 + 圆角的元素**只有这些胶囊**（2 套 = 4 个，每套 2 个），
         给一行"规格说明"比标题更重的形状就是层级倒挂；现在信息只由字号 + 颜色承担（都继承这里）。
         **减重也不能靠把颜色调淡**：浅色下 muted `#737373` 对白底是 4.74:1，刚过 WCAG AA 的
         4.5:1（深色 7.85:1），再淡就不合格 —— 能去掉的只有装饰（边框/内边距），不是对比度。
         分隔点用相邻兄弟选择器生成：workflow 的 heredoc 里 `.badge` / `.file` 是固定 class，
         在 CSS 里加分隔符就**不必动 YAML**；那个 `badge` 现在只是个普通 span，**别改名**
         （改名要动 workflow → 下一次 push 全量重编）。分隔点本身只有 2.12:1（浅色 #B2B2B2），
         是纯装饰；真嫌三项挨太近就把它提到满色（4.74:1），**不要**为此把胶囊加回来。 */
      .deck-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0;
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: hsl(var(--muted-foreground));
      }
      .badge + .badge::before,
      .badge + .file::before {
        content: "·";
        margin: 0 0.5rem;
        color: hsl(var(--muted-foreground) / 0.55);
      }

      /* ---------- hover 光边框（对应 magicui 的 BorderBeam） ---------- */
      @keyframes border-beam {
        to {
          offset-distance: 100%;
        }
      }
      .beam {
        pointer-events: none;
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1.5px solid transparent;
        opacity: 0;
        transition: opacity 0.3s ease;
        /* 只保留边框部分的遮罩 */
        -webkit-mask-image: linear-gradient(transparent, transparent), linear-gradient(#fff, #fff);
        mask-image: linear-gradient(transparent, transparent), linear-gradient(#fff, #fff);
        -webkit-mask-clip: padding-box, border-box;
        mask-clip: padding-box, border-box;
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
      }
      .deck:hover .beam {
        opacity: 1;
      }
      /* 光带依赖 offset-path: rect()。不支持时若照常渲染，会在左上角糊一块渐变色，
         所以整个伪元素都放进 @supports 里 —— 不支持就完全没有光带（纯装饰，不影响使用） */
      @supports (offset-path: rect(0 auto auto 0)) {
        .beam::after {
          content: "";
          position: absolute;
          aspect-ratio: 1 / 1;
          width: 90px;
          background: linear-gradient(to left, var(--accent-blue), var(--accent-yellow), transparent);
          offset-path: rect(0 auto auto 0 round 90px);
          offset-anchor: 90% 50%;
          animation: border-beam 3s infinite linear;
        }
      }

      /* ---------- 键盘焦点 ---------- */
      :focus-visible {
        outline: 2px solid hsl(var(--foreground));
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* 只给读屏软件的提示（切换结果、无 JS 提示） */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        clip-path: inset(50%);
        white-space: nowrap;
        overflow: hidden;
      }

      /* ---------- 页脚 ---------- */
      /* 位置：页面最下方、整行居中。原来它紧跟在最后一张卡片下面，
         只有一两套幻灯片时看着像"浮在中间"；现在由 body 的 flex 布局 + main 的
         flex:1 把它压到底部。这里只留一个最小间距（内容很长时不会贴住卡片）。 */
      footer {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.75rem;
        color: hsl(var(--muted-foreground));
      }
      footer a {
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .fade,
        .beam::after {
          animation: none;
        }
        .fade {
          opacity: 1;
          transform: none;
          filter: none;
        }
        /* 关掉动画后光带会定格成一个色块，不如直接不显示 */
        .beam {
          display: none;
        }
      }
    </style>
    <script>
      // 主题三态：auto / light / dark，localStorage 里只存一个键 theme。
      //   * auto（默认，也是没存过时的状态）：每次加载都重新读浏览器的 prefers-color-scheme，
      //     系统切换时实时跟随 —— 所以「每次刷新都按当前浏览器主题」成立；
      //   * light / dark：用户明确选过才固定下来，并停止跟随系统。
      // 为什么不是二态按钮：二态没有「跟随系统」这个位置，一按就得写死，检测于是永远失效；
      // 三态把 auto 变成可见、可切回的状态，矛盾就没了。
      // 这段在首次绘制前执行，避免闪一下浅色再变深。
      (function () {
        var root = document.documentElement;
        // 极老的浏览器可能没有 matchMedia：给个等价的桩，别让整段脚本在这里抛异常
        // （那样连点击监听都注册不上，按钮彻底失效）
        var query = window.matchMedia
          ? window.matchMedia("(prefers-color-scheme: dark)")
          : { matches: false, addEventListener: null, addListener: null };
        var mode = "auto";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") mode = saved;
        } catch (e) {}
        var announcedMode = mode; // 用来判断「模式真的变了」，切模式才播报，首屏不吵

        function apply(dark) {
          root.classList.toggle("dark", dark);
          // 同时告诉浏览器本页当前配色，表单控件/滚动条才不会反色
          root.style.colorScheme = dark ? "dark" : "light";
          // 地址栏/工具栏那圈颜色也跟着走（meta 的 media 只认系统偏好，手动固定后会不一致）
          var colors = document.querySelectorAll('meta[name="theme-color"]');
          if (colors.length) {
            colors.forEach(function (meta) {
              meta.removeAttribute("media");
              meta.setAttribute("content", dark ? "#09090B" : "#FFF");
            });
          }
        }
        // 按钮的无障碍状态要手动对齐：首屏这次在 DOM 就绪后补，之后每次系统切换时同步
        function syncButton(button) {
          if (!button) return;
          var dark = root.classList.contains("dark");
          // data-mode 决定显示哪个图标；label 说明点一下会去哪
          button.dataset.mode = mode;
          button.setAttribute("aria-pressed", mode === "dark" ? "true" : "false");
          var label =
            mode === "auto"
              ? "主题：自动，跟随系统（当前" + (dark ? "深色" : "浅色") + "）· 点击切换到浅色"
              : mode === "light"
                ? "主题：浅色 · 点击切换到深色"
                : "主题：深色 · 点击切换到自动";
          button.setAttribute("aria-label", label);
          button.title = label;
          // 切模式时给读屏软件播报一句（首屏那次不播报，免得页面一加载就说话）
          if (mode !== announcedMode) {
            announcedMode = mode;
            var status = document.getElementById("themeStatus");
            if (status) {
              status.textContent =
                mode === "auto"
                  ? "已切换到自动主题，跟随系统"
                  : mode === "light"
                    ? "已固定为浅色主题"
                    : "已固定为深色主题";
            }
          }
        }
        function followSystem() {
          // auto 才取系统值；手动固定时以 mode 为准，否则一刷新/一变化就被系统覆盖
          apply(mode === "auto" ? query.matches : mode === "dark");
          syncButton(document.getElementById("themeToggle"));
        }

        followSystem();

        // Safari 14 以前只支持已废弃的 addListener
        if (query.addEventListener) query.addEventListener("change", followSystem);
        else if (query.addListener) query.addListener(followSystem);

        // 按钮在这段脚本之后才解析出来，所以点击走事件委托
        document.addEventListener("click", function (event) {
          var button = event.target.closest("#themeToggle");
          if (!button) return;
          mode = mode === "auto" ? "light" : mode === "light" ? "dark" : "auto";
          try {
            if (mode === "auto") localStorage.removeItem("theme");
            else localStorage.setItem("theme", mode);
          } catch (e) {}
          followSystem();
        });

        // 这段脚本在 <head> 里执行，此时按钮还没解析出来，等 DOM 就绪再对齐它的状态
        document.addEventListener("DOMContentLoaded", function () {
          syncButton(document.getElementById("themeToggle"));
        });
      })();
    </script>
  </head>

  <body>
    <svg class="bg-grid" aria-hidden="true">
      <defs>
        <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse" x="-1" y="-1">
          <path d="M.5 25V.5H25" fill="none" stroke-dasharray="4 2" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>

    <header class="fade" style="--i: 0">
      <div class="head-row">
        <!-- 头像走仓库内静态资源 assets/icon.png（构建时拷进站点根目录），不用
             https://github.com/tortrixx.png 那种外链：那是全页唯一的跨站请求，还会
             302 到 avatars.githubusercontent.com（多一次 DNS+TLS，实测 1.8s 才拿到图，
             而且 302 带 cache-control: no-cache，每次打开都要重走一遍）。 -->
        <img
          class="avatar"
          src="icon.png"
          alt="tortrixx"
          width="64"
          height="64"
          onerror="this.remove()"
        />
        <!-- 全页唯一的 h1（以前这里是标语、`Slides` 只是 h2；合并的理由见 AGENTS.md「首页视觉」）。
             **别删掉这一处**：页面没有 h1 对读屏与搜索都不友好。
             标题旁不再显示套数（理由同上）。要恢复：在 h1 里加回那个套数 span —— 它是 COUNT
             的占位注释，**本文件里不能写出原文**（见文件开头那条坑）—— 并把上面那条 `.count`
             CSS 写回去；workflow 的替换规则一直留着，不用改 YAML。 -->
        <h1 class="page-title">Slides</h1>
        <span class="spacer"></span>
        <div class="head-actions">
          <button
            id="themeToggle"
            class="icon-btn"
            type="button"
            data-mode="auto"
            title="主题：自动，跟随系统 · 点击切换到浅色"
            aria-label="主题：自动，跟随系统 · 点击切换到浅色"
            aria-pressed="false"
          >
            <!-- 图标是纯装饰（可访问名由按钮的 aria-label 提供），对读屏软件隐藏 -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
              <!-- 三个图标分别代表三种模式，只显示当前那个（见下方 CSS）：
                   浅色=太阳、深色=月亮、自动=半明半暗的圆。
                   自动用「半明半暗」这个经典符号，而不是在太阳/月亮角上加点，
                   这样三个图标的分量才相当，看上去是一套。 -->
              <path
                class="icon-sun"
                fill="currentColor"
                fill-rule="evenodd"
                d="M12 17.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zm0 1.5a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm12-7a.8.8 0 0 1-.8.8h-2.4a.8.8 0 0 1 0-1.6h2.4a.8.8 0 0 1 .8.8zM4 12a.8.8 0 0 1-.8.8H.8a.8.8 0 0 1 0-1.6h2.5a.8.8 0 0 1 .8.8zm16.5-8.5a.8.8 0 0 1 0 1l-1.8 1.8a.8.8 0 0 1-1-1l1.7-1.8a.8.8 0 0 1 1 0zM6.3 17.7a.8.8 0 0 1 0 1l-1.7 1.8a.8.8 0 1 1-1-1l1.7-1.8a.8.8 0 0 1 1 0zM12 0a.8.8 0 0 1 .8.8v2.5a.8.8 0 0 1-1.6 0V.8A.8.8 0 0 1 12 0zm0 20a.8.8 0 0 1 .8.8v2.4a.8.8 0 0 1-1.6 0v-2.4a.8.8 0 0 1 .8-.8zM3.5 3.5a.8.8 0 0 1 1 0l1.8 1.8a.8.8 0 1 1-1 1L3.5 4.6a.8.8 0 0 1 0-1zm14.2 14.2a.8.8 0 0 1 1 0l1.8 1.7a.8.8 0 0 1-1 1l-1.8-1.7a.8.8 0 0 1 0-1z"
              />
              <g class="icon-auto">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
              </g>
              <path
                class="icon-moon"
                fill="currentColor"
                fill-rule="evenodd"
                d="M16.5 6A10.5 10.5 0 0 1 4.7 16.4 8.5 8.5 0 1 0 16.4 4.7l.1 1.3zm-1.7-2a9 9 0 0 1 .2 2 9 9 0 0 1-11 8.8 9.4 9.4 0 0 1-.8-.3c-.4 0-.8.3-.7.7a10 10 0 0 0 .3.8 10 10 0 0 0 9.2 6 10 10 0 0 0 4-19.2 9.7 9.7 0 0 0-.9-.3c-.3-.1-.7.3-.6.7a9 9 0 0 1 .3.8z"
              />
            </svg>
          </button>
          <a class="gh" href="https://github.com/tortrixx/slides" target="_blank" rel="noopener noreferrer"
            aria-label="GitHub 仓库" title="GitHub 仓库">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
              />
              <path d="M9 18c-4.51 2-5-2-7-2" />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main>
      <!-- ================= 幻灯片 ================= -->
      <!-- 这一节没有自己的标题：页面标题（h1 Slides）已经在顶栏里，这里再写一遍就是重复 -->
      <section class="fade" style="--i: 1">
        <!--SLIDES-->
      </section>
    </main>

    <footer class="fade" style="--i: 2">
      <!--META-->
    </footer>
    <span id="themeStatus" class="sr-only" role="status" aria-live="polite"></span>

    <noscript>
      <p class="sr-only">当前浏览器未启用 JavaScript，页面固定为浅色主题。</p>
    </noscript>
  </body>
</html>
